name: Ägarbeslut
description: Begär ett beslut som ligger utanför AI-mandatet.
title: "decision: "
labels: ["type:owner-decision", "status:blocked"]
body:
  - type: input
    id: decision_key
    attributes:
      label: Stabil beslutsnyckel
      placeholder: DEC-access-provider-v1
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Sammanhang och blockerade uppgifter
    validations:
      required: true
  - type: textarea
    id: options
    attributes:
      label: Alternativ, rekommendation och konsekvenser
    validations:
      required: true
  - type: input
    id: response_date
    attributes:
      label: Motiverat sista svarsdatum
  - type: textarea
    id: source_links
    attributes:
      label: Länkar till berörda krav, ADR eller plan
    validations:
      required: true
