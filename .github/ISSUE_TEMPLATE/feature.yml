name: Funktion
description: Föreslå eller specificera en användarfunktion.
title: "feat: "
labels: ["type:feature", "status:planned"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem och målgrupp
      description: Vilket verifierat behov löses?
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptanskriterier
      description: Observerbara kriterier, inklusive felvägar när relevanta.
    validations:
      required: true
  - type: textarea
    id: dependencies
    attributes:
      label: Beroenden och risker
  - type: input
    id: requirement
    attributes:
      label: Kravmatris-ID
      placeholder: PRD-01
    validations:
      required: true
